name: Unit Tests
on:
  # Runtime checkpoints are committed with "[skip ci]", so only human code
  # pushes and manual dispatches start this workflow.
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GIT_TERMINAL_PROMPT: "0"
  RUNTIME_PRIVATE_LOG: /tmp/test_output.txt

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository code
        id: checkout
        timeout-minutes: 5
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        timeout-minutes: 5
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install git-crypt
        timeout-minutes: 5
        run: |
          set +e
          run_apt() { sudo apt-get install -y git-crypt; }
          out=$(run_apt 2>&1); rc=$?
          if [ $rc -ne 0 ] && printf '%s' "$out" | grep -qE "Temporary failure resolving|Could not resolve|Name or service not known"; then
            echo "::notice::apt DNS failure detected; resolving apt hosts via DoH and pinning /etc/hosts (upstream DNS outage workaround)"
            apt_hosts=$(grep -rhoE 'https?://[^/[:space:]"]+' /etc/apt/sources.list /etc/apt/sources.list.d/ /etc/apt/apt-mirrors.txt 2>/dev/null | sed -E 's|https?://||' | sort -u)
            for h in $apt_hosts azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
              getent hosts "$h" >/dev/null 2>&1 && continue
              ip=$(curl -sf --max-time 10 "https://dns.google/resolve?name=$h&type=A" | python3 -c 'import json,sys; print(next((a["data"] for a in json.load(sys.stdin).get("Answer",[]) if a.get("type")==1), ""))' 2>/dev/null)
              if [ -z "$ip" ]; then
                ip=$(curl -sf --max-time 10 -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$h&type=A" | python3 -c 'import json,sys; print(next((a["data"] for a in json.load(sys.stdin).get("Answer",[]) if a.get("type")==1), ""))' 2>/dev/null)
              fi
              [ -n "$ip" ] && { echo "$ip $h" | sudo tee -a /etc/hosts; echo "::notice::pinned $h -> $ip"; }
            done
            out=$(run_apt 2>&1); rc=$?
          fi
          printf '%s\n' "$out"
          exit "$rc"

      - name: Unlock git-crypt
        id: unlock
        timeout-minutes: 3
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          umask 077
          trap 'rm -f git-crypt-key' EXIT
          printf '%s' "$GIT_CRYPT_KEY" | base64 -d > git-crypt-key
          git-crypt unlock git-crypt-key

      - name: Install dependencies
        timeout-minutes: 7
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        id: tests
        timeout-minutes: 10
        # No marketplace or Discord credentials are provided to this step: the
        # suite mocks every external call, and a stray live request must fail.
        run: |
          printf '[WORKFLOW] unit tests for %s\n' "$GITHUB_SHA" > "$RUNTIME_PRIVATE_LOG"
          # Detailed output (test names, simulated bot messages) stays out of the
          # public job log and is delivered to the private run-log webhook.
          if PYTHONUNBUFFERED=1 PYTHONIOENCODING=utf-8 python -X utf8 -m unittest discover -s tests -p "test_*.py" >> "$RUNTIME_PRIVATE_LOG" 2>&1; then
            echo "Unit tests passed."
          else
            echo "::error title=Unit tests failed::Detailed output was kept out of Actions logs and sent to the private run-log webhook."
            exit 1
          fi

      - name: Verify the test run left the checkout unchanged
        id: worktree
        if: ${{ always() && steps.unlock.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            printf '\n[WORKFLOW] Test run modified tracked files:\n' >> "$RUNTIME_PRIVATE_LOG"
            git status --porcelain >> "$RUNTIME_PRIVATE_LOG"
            echo "::error title=Test run modified tracked files::Details were sent to the private run-log webhook."
            exit 1
          fi
          echo "Checkout unchanged by the test run."

      - name: Send logs to Discord
        if: ${{ always() && steps.unlock.outcome == 'success' }}
        # Observability must not rewrite the test result; the helper still exits
        # nonzero and emits a warning when delivery fails.
        continue-on-error: true
        timeout-minutes: 10
        env:
          DISCORD_LOG_WEBHOOK_URL: ${{ secrets.DISCORD_LOG_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          UNLOCK_OUTCOME: ${{ steps.unlock.outcome }}
          VALIDATION_OUTCOME: ${{ steps.worktree.outcome }}
          MONITOR_OUTCOME: ${{ steps.tests.outcome }}
        run: python .github/scripts/send_private_log.py
